name: Error
description: Reportar un comportamiento reproducible
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Qué ocurrió
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué debería ocurrir
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Cómo reproducirlo
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia sin información sensible
