name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build and checks
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Nuvyra.slnx
      - run: dotnet build Nuvyra.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/Nuvyra.UnitTests --configuration Release --no-build --no-restore

  web:
    name: Web · typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run build

  dependency-audit:
    name: Security · dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Restore .NET packages
        run: dotnet restore Nuvyra.slnx
      - name: Check vulnerable .NET packages
        run: dotnet list Nuvyra.slnx package --vulnerable --include-transitive
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --ignore-scripts
      - name: Check high-severity npm advisories
        working-directory: apps/web
        run: npm audit --audit-level=high
